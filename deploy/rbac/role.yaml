---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gatus-sidecar
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gatus.kalexlab.xyz
  resources:
  - endpointtemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gatus.kalexlab.xyz
  resources:
  - endpointtemplates/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - traefik.io
  resources:
  - ingressroutes
  - ingressroutetcps
  verbs:
  - get
  - list
  - watch
