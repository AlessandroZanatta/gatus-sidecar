# Direct translation of the YAML anchors in a hand-maintained Gatus config.
#
# common-alerts is the part both anchors shared. The two default-* templates
# apply automatically to every discovered endpoint of a matching scheme, so a
# workload only has to opt in and never names a template at all.
---
apiVersion: gatus.kalexlab.xyz/v1alpha1
kind: EndpointTemplate
metadata:
  name: common-alerts
spec:
  # No defaultFor: this one is only ever pulled in through extends.
  endpoint:
    interval: 1m
    alerts:
      - type: telegram
      - type: telegram
        provider-override:
          id: "${TELEGRAM_SECONDARY_ID}"
---
apiVersion: gatus.kalexlab.xyz/v1alpha1
kind: EndpointTemplate
metadata:
  name: default-http
spec:
  extends: [common-alerts]
  # Applies to every endpoint resolving to http or https, unannotated.
  defaultFor: [http, https]
  scheme: http
  endpoint:
    conditions:
      - "[STATUS] == 200"
---
apiVersion: gatus.kalexlab.xyz/v1alpha1
kind: EndpointTemplate
metadata:
  name: default-tcp
spec:
  extends: [common-alerts]
  defaultFor: [tcp]
  scheme: tcp
  endpoint:
    conditions:
      - "[CONNECTED] == true"
