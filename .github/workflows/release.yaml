name: Release

# Releasing is chained to CI rather than to the push itself: the workflow merges
# its own release pull request, so a green main is the only thing standing
# between a commit and a published image. A red main releases nothing.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # release-please reads Conventional Commit messages since the last release and
  # opens a pull request containing the version bump and the generated CHANGELOG:
  # fix -> patch, feat -> minor, ! or BREAKING CHANGE -> major. That pull request
  # is merged here rather than by hand, so a push to main releases itself.
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    # workflow_run fires whatever CI concluded, so the conclusion is checked
    # here. A manual dispatch is taken at its word.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      # The release can be created by either release-please run: the first when
      # the pull request was merged by hand, the second when this job merged it.
      released: ${{ steps.release.outputs.release_created == 'true' || steps.tag.outputs.release_created == 'true' }}
      tag: ${{ steps.tag.outputs.tag_name || steps.release.outputs.tag_name }}
      version: ${{ steps.tag.outputs.version || steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release pull request only ever contains the version bump and the
      # CHANGELOG, both generated from commits CI already ran on, so there is
      # nothing left to review. Waiting for a human just delays the image.
      - name: Merge the release pull request
        if: steps.release.outputs.pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ fromJSON(steps.release.outputs.pr).number }}
        run: gh pr merge --squash --delete-branch --repo "$GITHUB_REPOSITORY" "$PR"

      # A merge made with GITHUB_TOKEN raises no push event, by design, so this
      # workflow will not run again for it. release-please is re-run here instead:
      # it now sees the release commit on main and creates the tag and release
      # that the publish job below builds from.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: tag
        if: steps.release.outputs.pr
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish image
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for the build provenance attestation below.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          # A released image gets the exact version, the moving major and
          # major.minor tags, and latest.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release-please.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Lets a consumer verify the image really came from this workflow.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # The CRD is deliberately not attached as a release asset. The tag already
      # makes it fetchable at an exact version straight from the repository, and
      # uploading an asset would need contents: write on a job that pushes images
      # and holds an id-token.
