name: CI

on:
  push:
    branches: [main]
  # The release pull request touches only these two files, and the release
  # workflow merges it seconds after opening it. A run started for it would find
  # the pull request already merged and its branch deleted, and fail without
  # running a job. Nothing in these files needs CI anyway.
  pull_request:
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # make's VERSION comes from git describe, which needs the tags.
          fetch-depth: 0

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # Generated-file drift, formatting, vet, build and unit tests. Kept in the
      # Makefile so the same command reproduces a CI failure locally.
      - run: make ci

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # The suite creates and deletes its own cluster; this only installs the CLI.
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          install_only: true

      - run: make test-e2e

  image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only, never push: a pull request from a fork must not be able to
      # publish to the registry.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
